<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyRates | EnTdecker 2.0</title>
    <!-- Avant-garde typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Karla:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --color-bg: #ecece8;
            --color-fg: #1a1a1a;
            --color-accent: #d32f2f;
            --color-border: #1a1a1a;
        }
        body {
            background-color: var(--color-bg);
            color: var(--color-fg);
            font-family: 'Karla', sans-serif;
            overflow-x: hidden;
            border: 12px solid var(--color-border);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* Diagonal brutalist stripes */
        .stripe-bg {
            background: repeating-linear-gradient(
                -45deg,
                var(--color-bg),
                var(--color-bg) 10px,
                #dfdfdb 10px,
                #dfdfdb 12px
            );
        }

        h1, h2, h3, .heading-font {
            font-family: 'Cinzel Decorative', serif;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(3rem, 8vw, 8rem);
            line-height: 0.85;
            letter-spacing: -2px;
            margin: 0;
            padding: 2rem 0;
            border-bottom: 4px solid var(--color-border);
            text-align: center;
            background: var(--color-accent);
            color: var(--color-bg);
            mix-blend-mode: multiply;
        }

        .container-hero {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            padding: 2rem;
        }
        @media(min-width: 1024px) {
            .container-hero {
                grid-template-columns: 3fr 2fr;
                border-bottom: 2px solid var(--color-border);
            }
        }

        /* Heavy Brutalist Borders */
        .brutalist-card {
            border: 3px solid var(--color-border);
            background: var(--color-bg);
            box-shadow: 12px 12px 0 var(--color-border);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 2rem;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        .brutalist-header {
            border-bottom: 3px solid var(--color-border);
            padding: 1rem 1.5rem;
            background: var(--color-border);
            color: var(--color-bg);
            font-weight: 800;
            font-size: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .brutalist-body {
            padding: 2rem;
        }

        button.btn-brutal {
            appearance: none;
            background: var(--color-accent);
            color: var(--color-bg);
            border: 3px solid var(--color-border);
            padding: 1rem 2rem;
            font-family: 'Karla', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 6px 6px 0 var(--color-border);
            transition: all 0.1s;
        }
        button.btn-brutal:active {
            box-shadow: 2px 2px 0 var(--color-border);
            transform: translate(4px, 4px);
        }

        textarea.input-brutal {
            width: 100%;
            height: 150px;
            background: transparent;
            border: 3px solid var(--color-border);
            padding: 1rem;
            font-family: 'Karla', monospace;
            font-size: 1.1rem;
            resize: vertical;
            outline: none;
        }
        textarea.input-brutal:focus {
            background: #fff;
            box-shadow: inset 4px 4px 0 rgba(0,0,0,0.1);
        }

        table.brutal-table {
            width: 100%;
            border-collapse: collapse;
            border: 3px solid var(--color-border);
            margin-top: 2rem;
        }
        table.brutal-table th {
            background: var(--color-border);
            color: var(--color-bg);
            padding: 1rem;
            text-align: left;
            font-weight: 800;
            text-transform: uppercase;
        }
        table.brutal-table td {
            border: 2px solid var(--color-border);
            padding: 1rem;
            font-family: monospace;
            font-size: 1.1rem;
        }

        .loader-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--color-accent);
            color: var(--color-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transform: translateY(-100%);
            transition: transform 0.5s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .loader-overlay.active {
            transform: translateY(0);
        }

        #ketcher-iframe {
            width: 100%;
            height: 500px;
            border: 3px solid var(--color-border);
        }

        /* Decorative marks */
        .deco-number {
             font-family: 'Cinzel Decorative', serif;
             font-size: 6rem;
             opacity: 0.1;
             position: absolute;
             top: -20px;
             right: -20px;
             pointer-events: none;
        }
    </style>
</head>
<body class="stripe-bg">

    <div class="loader-overlay" id="loader">
        <h2 class="text-6xl md:text-9xl blink">COMPUTING...</h2>
    </div>

    <h1>PyRates / EnTdecker 2.0</h1>

    <div class="container-hero">

        <!-- Input Section -->
        <div class="relative">
            <div class="brutalist-card relative overflow-hidden">
                <div class="deco-number">01</div>
                <div class="brutalist-header">Molecular Input</div>
                <div class="brutalist-body space-y-6">
                    <div>
                        <label class="block font-bold uppercase mb-2">Input SMILES (batch support)</label>
                        <textarea id="smiles-input" class="input-brutal" placeholder="e.g. C1=CC=CC=C1&#10;CCO"></textarea>
                    </div>

                    <button class="btn-brutal w-full" onclick="runAnalysis()">Analyze Molecule(s)</button>

                    <div id="error-box" class="hidden mt-4 p-4 border-3 border-red-600 bg-red-100 text-red-800 font-bold"></div>
                </div>
            </div>

            <!-- Sketcher section. We use an external Ketcher instance by default. -->
            <div class="brutalist-card">
                 <div class="brutalist-header" style="background:var(--color-accent);">Sketcher (Ketcher)</div>
                 <div class="brutalist-body" style="padding: 0;">
                     <!-- Users can draw molecules here. To retrieve smiles, copy it from ketcher and paste. -->
                     <iframe id="ketcher-iframe" src="https://lifescience.opensource.epam.com/ketcher/index.html"></iframe>
                 </div>
                 <div class="p-3 bg-white border-t-3 border-black text-sm uppercase font-bold">
                     Use Ketcher to draw, then export SMILES and paste it above!
                 </div>
            </div>
        </div>

        <!-- Results Section -->
        <div>
            <div class="brutalist-card">
                <div class="deco-number" style="opacity: 0.05;">02</div>
                <div class="brutalist-header bg-black text-white">Analysis Results</div>
                <div class="brutalist-body bg-white stripe-bg" style="min-height: 400px; background: #fff;">
                    <div id="results-container">
                        <p class="text-xl font-bold opacity-50">NO DATA YET. AWAITING INPUT.</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        async function runAnalysis() {
            const rawSmiles = document.getElementById('smiles-input').value;
            const smilesArray = rawSmiles.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            const errBox = document.getElementById('error-box');
            errBox.classList.add('hidden');
            errBox.innerText = '';

            if (smilesArray.length === 0) {
                errBox.innerText = "Please provide at least one SMILES.";
                errBox.classList.remove('hidden');
                return;
            }

            const loader = document.getElementById('loader');
            loader.classList.add('active');

            try {
                const res = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ smiles: smilesArray })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || data.error || 'Server error');
                }

                renderResults(data.results, data.invalid);

            } catch (e) {
                errBox.innerText = e.message;
                errBox.classList.remove('hidden');
            } finally {
                loader.classList.remove('active');
            }
        }

        function renderResults(results, invalid) {
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            if (invalid && invalid.length > 0) {
                const warn = document.createElement('div');
                warn.className = 'bg-yellow-200 border-2 border-black p-2 mb-4 font-bold';
                warn.innerText = 'Ignored invalid SMILES: ' + invalid.join(', ');
                container.appendChild(warn);
            }

            if (!results || results.length === 0) {
                container.innerHTML += '<p class="text-xl font-bold opacity-50">NO VALID RESULTS.</p>';
                return;
            }

            const table = document.createElement('table');
            table.className = 'brutal-table';

            // Header
            const thead = document.createElement('thead');
            thead.innerHTML = `
                <tr>
                    <th>SMILES</th>
                    <th>E_T (kcal/mol)</th>
                    <th>λ_S_T</th>
                    <th>λ_T_S</th>
                </tr>
            `;
            table.appendChild(thead);

            // Body
            const tbody = document.createElement('tbody');
            results.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="word-break: break-all;">${row.smiles}</td>
                    <td>${Number(row.triplet_energy_adiabatic).toFixed(2)}</td>
                    <td>${Number(row.lamda_S_T).toFixed(2)}</td>
                    <td>${Number(row.lamda_T_S).toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            container.appendChild(table);
        }
    </script>
</body>
</html>
