<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyRates | EnTdecker 2.0</title>
    <!-- Sleek Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
        :root {
            /* Light Theme (Default) */
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-heading: #0f172a;
            --accent-gradient: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
            --border-color: rgba(0, 0, 0, 0.1);
            --ring-color: #4f46e5;
            --input-bg: rgba(0, 0, 0, 0.02);
            --input-bg-focus: #ffffff;
            --glass-shadow: 0 10px 30px -10px rgba(0,0,0,0.1);
            --bg-gradient: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
            --modal-bg: rgba(255, 255, 255, 0.4);
            --modal-overlay: rgba(255, 255, 255, 0.8);
            --btn-ghost-bg: rgba(0,0,0,0.05);
            --btn-ghost-hover: rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            /* Dark Theme */
            --bg-body: #020617;
            --bg-surface: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-heading: #ffffff;
            --accent-gradient: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
            --border-color: rgba(255, 255, 255, 0.08);
            --ring-color: #6366f1;
            --input-bg: rgba(255, 255, 255, 0.03);
            --input-bg-focus: rgba(255, 255, 255, 0.05);
            --glass-shadow: 0 20px 40px -20px rgba(0,0,0,0.5);
            --bg-gradient: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.1) 0%, transparent 50%);
            --modal-bg: rgba(2, 6, 23, 0.4);
            --modal-overlay: rgba(0, 0, 0, 0.8);
            --btn-ghost-bg: rgba(255,255,255,0.05);
            --btn-ghost-hover: rgba(255,255,255,0.1);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Manrope', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: var(--bg-gradient);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        h1.title {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            padding: 3rem 0 2rem 0;
            margin: 0;
            letter-spacing: -0.025em;
        }

        .container-main {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem 4rem 2rem;
            transition: all 0.5s ease;
        }

        .input-section, .results-section, .marcus-section {
            width: 100%;
            transition: all 0.5s ease;
            transform-origin: center;
        }

        .marcus-section {
            display: none;
            flex-direction: column;
        }

        /* Mobile specific states */
        .container-main.has-marcus .marcus-section {
            display: flex;
        }
        .container-main.focus-input .results-section,
        .container-main.focus-input .marcus-section,
        .container-main.has-results .input-section,
        .container-main.has-marcus .input-section,
        .container-main.has-marcus .results-section {
            opacity: 0.6;
            transform: scale(0.98);
        }

        /* Desktop Timeline View */
        @media(min-width: 1024px) {
            .container-main {
                flex-direction: row;
                align-items: flex-start;
                overflow-x: auto;
                scroll-behavior: smooth;
                padding-bottom: 2rem; /* Give space for scrollbar */
            }

            /* Nice subtle scrollbar */
            .container-main::-webkit-scrollbar {
                height: 8px;
            }
            .container-main::-webkit-scrollbar-thumb {
                background: var(--text-muted);
                border-radius: 4px;
            }
            .container-main::-webkit-scrollbar-track {
                background: transparent;
            }

            .marcus-section {
                display: flex; /* Make it live in the timeline even when not focused */
            }

            .input-section, .results-section, .marcus-section {
                flex-shrink: 0;
                width: calc(40% - 1rem); /* Base inactive width */
                opacity: 0.6;
                transform: scale(0.96);
                cursor: pointer;
            }

            .input-section:hover, .results-section:hover, .marcus-section:hover {
                opacity: 0.8;
                transform: scale(0.98);
            }

            /* Active UI panel state */
            .container-main.focus-input .input-section,
            .container-main.has-results .results-section,
            .container-main.has-marcus .marcus-section {
                width: calc(60% - 1rem);
                opacity: 1;
                transform: scale(1);
                cursor: default;
            }
        }

        .glass-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            box-shadow: var(--glass-shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .panel-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 1.125rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-heading);
            transition: border-color 0.3s ease;
        }

        .panel-body {
            padding: 1.5rem;
        }

        .btn-sleek {
            background: var(--accent-gradient);
            color: #ffffff;
            border: none;
            border-radius: 0.75rem;
            padding: 0.875rem 1.5rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
            width: 100%;
        }
        .btn-sleek:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }
        .btn-sleek:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.3);
        }

        .input-sleek {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1rem;
            color: var(--text-main);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            resize: vertical;
        }
        .input-sleek:focus {
            outline: none;
            border-color: var(--ring-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: var(--input-bg-focus);
        }

        .sleek-table {
            width: 100%;
            border-collapse: collapse;
        }
        .sleek-table th {
            text-align: left;
            padding: 1rem;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.875rem;
            border-bottom: 1px solid var(--border-color);
        }
        .sleek-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            color: var(--text-main);
        }
        .sleek-table tr:hover td {
            background: var(--btn-ghost-bg);
        }

        .loader-overlay {
            position: fixed;
            inset: 0;
            background: var(--modal-overlay);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .loader-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .spinner {
            width: 3rem;
            height: 3rem;
            border: 3px solid var(--border-color);
            border-top-color: var(--ring-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #ketcher-iframe {
            width: 100%;
            height: 500px;
            border: none;
            background: #ffffff;
            transition: filter 0.3s;
        }
        [data-theme="dark"] #ketcher-iframe {
            background: #0f172a;
            /* Invert the bright Ketcher interface to match the dark theme */
            filter: invert(0.92) hue-rotate(180deg);
        }

        /* Modal Styles for Full Analysis */
        .modal {
            position: fixed; inset: 0; background: var(--modal-overlay); backdrop-filter: blur(5px);
            display: none; align-items: center; justify-content: center; z-index: 10000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--bg-surface); width: 90%; max-width: 1200px; max-height: 90vh;
            border: 1px solid var(--border-color); border-radius: 1.25rem;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: var(--glass-shadow);
        }
        .modal-header {
            padding: 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;
        }
        .modal-body {
            padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 2rem;
        }
        .close-btn { color: var(--text-muted); cursor: pointer; transition: color 0.2s; }
        .close-btn:hover { color: var(--text-heading); }

        .theme-toggle-btn {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--glass-shadow);
            transition: all 0.2s;
        }
        .theme-toggle-btn:hover {
            transform: scale(1.1);
        }
        [data-theme="dark"] .icon-sun { display: none; }
        [data-theme="light"] .icon-moon { display: none; }

        /* Custom Toggle Switch for Uncertainty */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background-color: var(--text-muted);
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--ring-color);
            border-color: var(--ring-color);
        }
        input:checked + .slider:before {
            transform: translateX(20px);
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <button onclick="toggleTheme()" class="theme-toggle-btn" title="Toggle Theme">
        <svg class="w-5 h-5 icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        <svg class="w-5 h-5 icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
    </button>

    <!-- Modal for Mode Plot -->
    <div id="mode-plot-modal" class="modal">
        <div class="modal-content" style="max-width: 900px;">
            <div class="modal-header">
                <h3 class="text-lg font-bold text-[var(--text-heading)] flex items-center gap-2" id="mode-plot-title">
                    Mode Distribution
                </h3>
                <button class="close-btn" onclick="closeModeModal()">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="modal-body items-center" id="mode-plot-body">
                <img id="mode-plot-img" src="" alt="Mode plot" class="w-full h-auto rounded opacity-0 transition-opacity duration-300 hidden" />
                <div id="mode-plot-loader" class="spinner border-t-[#6366f1]"></div>
            </div>
        </div>
    </div>

    <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <p class="text-sm font-medium tracking-widest text-[#94a3b8] uppercase">Computing Results</p>
    </div>

    <h1 class="title">PyRates / EnTdecker 2.0</h1>

    <div id="main-container" class="container-main focus-input">

        <!-- Input Section -->
        <div class="flex flex-col gap-8 input-section" onclick="handleSectionClick('input')">
            <div class="glass-panel">
                <div class="panel-header justify-between">
                    <div class="flex items-center gap-2">
                        <svg class="w-5 h-5 text-[#0ea5e9]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                        Molecular Input
                    </div>
                    <button class="text-xs bg-[var(--btn-ghost-bg)] text-[var(--text-muted)] hover:text-[var(--text-main)] px-3 py-1.5 rounded hover:bg-[var(--btn-ghost-hover)] transition-colors" onclick="clearInput()">Clear</button>
                </div>
                <div class="panel-body space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-[var(--text-muted)] mb-2">Input SMILES</label>
                        <textarea id="smiles-input" class="input-sleek" rows="4" placeholder="e.g. C1=CC=CC=C1&#10;CCO"></textarea>
                    </div>

                    <button class="btn-sleek" onclick="runAnalysis()">Analyze Molecule(s)</button>

                    <div id="error-box" class="hidden mt-4 p-4 rounded-xl border border-red-500/30 bg-red-500/10 text-red-400 font-medium text-sm"></div>
                </div>
            </div>

            <!-- Sketcher section -->
            <div class="glass-panel">
                 <div class="panel-header justify-between cursor-pointer select-none" onclick="toggleKetcher()">
                     <div class="flex items-center gap-2">
                         <svg class="w-5 h-5 text-[#8b5cf6]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                         Sketcher
                     </div>
                     <svg id="ketcher-toggle-icon" class="w-5 h-5 text-[var(--text-muted)] transition-transform duration-300 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                 </div>
                 <div id="ketcher-content" class="transition-all duration-300 overflow-hidden" style="max-height: 1000px; opacity: 1;">
                     <div class="p-0">
                         <iframe id="ketcher-iframe" src="/static/ketcher/index.html"></iframe>
                     </div>
                     <div class="flex items-center justify-between px-4 py-3 bg-[rgba(255,255,255,0.02)] border-t border-[var(--border-color)]">
                         <span class="text-xs text-[var(--text-muted)]">Use Ketcher to draw, then load SMILES</span>
                         <button onclick="getSmilesFromKetcher()" class="text-xs font-semibold bg-[#8b5cf6] text-white border border-[#8b5cf6] px-3 py-1.5 rounded-lg hover:bg-[#7c3aed] transition-colors">
                             Load SMILES
                         </button>
                     </div>
                 </div>
            </div>
        </div>

        <!-- Results Section -->
        <div class="glass-panel h-max results-section" onclick="handleSectionClick('results')">
            <div class="panel-header flex-wrap">
                <div class="flex items-center gap-2 flex-1">
                    <svg class="w-5 h-5 text-[#6366f1]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    <span>Analysis Results</span>
                </div>
                <div class="flex items-center gap-3">
                    <select id="unit-select" class="input-sleek w-auto py-1 px-2 text-xs" onchange="runRenderResults()">
                        <option value="kcal/mol">kcal/mol</option>
                        <option value="kJ/mol">kJ/mol</option>
                        <option value="eV">eV</option>
                        <option value="Hartree">Hartree</option>
                    </select>
                </div>
            </div>
            <div class="panel-body">
                <div id="results-container" class="overflow-x-auto mb-4">
                    <div class="flex flex-col items-center justify-center py-12 text-[var(--text-muted)]">
                        <svg class="w-12 h-12 mb-4 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                        <p class="text-sm font-medium">No data yet. Awaiting input.</p>
                    </div>
                </div>
                <!-- Action to open Marcus Theory -->
                <button id="btn-marcus" class="btn-sleek hidden mt-4 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 shadow-emerald-500/30" onclick="toggleMarcusTheory(event)">
                    Marcus Theory Analysis
                </button>
            </div>
        </div>

        <!-- Marcus Theory Section -->
        <div class="glass-panel h-max marcus-section" onclick="handleSectionClick('marcus')">
            <div class="panel-header flex-wrap">
                <div class="flex items-center gap-2 flex-1">
                    <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    <span>Marcus Theory Analysis</span>
                </div>
                <button class="text-xs bg-[var(--btn-ghost-bg)] text-[var(--text-muted)] hover:text-[var(--text-main)] px-3 py-1.5 rounded hover:bg-[var(--btn-ghost-hover)] transition-colors" onclick="closeMarcusTheory(event)">Close</button>
            </div>
            <div class="panel-body space-y-6">

                <div class="flex items-center gap-4 flex-wrap">
                    <div class="flex-1 min-w-[200px]">
                        <label class="block text-sm font-medium text-[var(--text-muted)] mb-2">Photocatalyst</label>
                        <select id="pc-select" class="input-sleek py-2" onchange="runMarcusAnalysis()"></select>
                    </div>
                    <div class="flex-1 min-w-[200px]">
                        <label class="block text-sm font-medium text-[var(--text-muted)] mb-2">Quencher</label>
                        <select id="quencher-select" class="input-sleek py-2" onchange="runMarcusAnalysis()"></select>
                    </div>
                </div>

                <div id="marcus-results-container">
                    <div class="flex flex-col items-center justify-center py-12 text-[var(--text-muted)]">
                        <p class="text-sm font-medium">Select a photocatalyst and quencher.</p>
                    </div>
                </div>

                <div class="bg-[var(--bg-surface)] rounded-xl overflow-hidden shadow-[0_0_20px_rgba(0,0,0,0.1)] [data-theme='dark']:shadow-[0_0_20px_rgba(0,0,0,0.5)] border border-[var(--border-color)]">
                    <div id="marcus-plot-container" class="w-full min-h-[400px] flex items-center justify-center">
                        <p class="text-sm text-[var(--text-muted)]">Plot will appear here</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        window.appData = []; // Store latest results globally
        window.modePlotCache = {}; // Cache for prefetched mode plots
        window.pcData = []; // Store photocatalyst data

        const FACTORS_TO_KCAL = {
            "kcal/mol": 1.0,
            "kJ/mol": 0.2390057361376673,
            "eV": 23.060548868,
            "Hartree": 627.5094740631,
        };

        function handleSectionClick(section) {
            const container = document.getElementById('main-container');
            const hasData = window.appData && window.appData.length > 0;

            // Allow interacting with results/marcus only if data exists
            if (!hasData && section !== 'input') {
                return;
            }

            container.classList.remove('focus-input', 'has-results', 'has-marcus');

            if (section === 'input') {
                container.classList.add('focus-input');
                document.querySelector('.input-section').scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
            } else if (section === 'results') {
                container.classList.add('has-results');
                document.querySelector('.results-section').scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            } else if (section === 'marcus') {
                container.classList.add('has-marcus');
                document.querySelector('.marcus-section').scrollIntoView({ behavior: 'smooth', inline: 'end', block: 'nearest' });
            }
        }

        function convertEnergy(val, toUnit) {
            return (val * FACTORS_TO_KCAL["kcal/mol"]) / FACTORS_TO_KCAL[toUnit];
        }

        function toggleKetcher() {
            const content = document.getElementById('ketcher-content');
            const icon = document.getElementById('ketcher-toggle-icon');
            if (content.style.maxHeight === '0px' || content.style.maxHeight === '') {
                content.style.maxHeight = '1000px';
                content.style.opacity = '1';
                icon.classList.add('rotate-180');
            } else {
                content.style.maxHeight = '0px';
                content.style.opacity = '0';
                icon.classList.remove('rotate-180');
            }
        }

        function clearInput() {
            document.getElementById('smiles-input').value = '';
            document.getElementById('error-box').classList.add('hidden');
            document.getElementById('btn-marcus').classList.add('hidden');
            window.appData = [];
            window.modePlotCache = {};
            const container = document.getElementById('main-container');
            container.classList.remove('has-results', 'focus-input', 'has-marcus');
            runRenderResults();
        }

        function closeModeModal() {
            document.getElementById('mode-plot-modal').classList.remove('active');
        }

        async function prefetchModePlot(row, valKey, name) {
            const currentTheme = document.body.getAttribute('data-theme') || 'light';
            const selectedUnit = document.getElementById('unit-select').value;
            const cacheKey = `${row.smiles}_${valKey}_${currentTheme}_${selectedUnit}`;
            if (window.modePlotCache[cacheKey]) return; // Already requested or fetched

            window.modePlotCache[cacheKey] = 'loading'; // Mark as loading

            try {
                const reqBody = {
                    mu: row[`${valKey}_mdn_mu`].map(x => convertEnergy(x, selectedUnit)),
                    sigma: row[`${valKey}_mdn_sigma`].map(x => convertEnergy(x, selectedUnit)),
                    pi: row[`${valKey}_mdn_pi`],
                    predicted_value: convertEnergy(row[valKey], selectedUnit),
                    uncertainty: convertEnergy(row[`${valKey}_uncertainty`], selectedUnit),
                    target_name: name,
                    unit: selectedUnit,
                    theme: currentTheme
                };
                const r = await fetch('/api/plot/mode', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(reqBody)
                });
                if(r.ok) {
                    const blob = await r.blob();
                    window.modePlotCache[cacheKey] = URL.createObjectURL(blob);
                } else {
                    window.modePlotCache[cacheKey] = 'error';
                }
            } catch(e) {
                window.modePlotCache[cacheKey] = 'error';
            }
        }

        function prefetchInitialPlots() {
            const vars = [
                {valKey: 'triplet_energy_adiabatic', name: 'Triplet energy (adiabatic)'},
                {valKey: 'lamda_S_T', name: '(S†→T)'},
                {valKey: 'lamda_T_S', name: '(T†→S)'}
            ];
            window.appData.forEach(row => {
                vars.forEach(v => prefetchModePlot(row, v.valKey, v.name));
            });
        }

        async function showModePlot(idx, valKey, name) {
            const row = window.appData[idx];
            if(!row) return;
            const modal = document.getElementById('mode-plot-modal');

            const currentTheme = document.body.getAttribute('data-theme') || 'light';
            const selectedUnit = document.getElementById('unit-select').value;

            document.getElementById('mode-plot-title').innerText = `Mode Distribution: ${name} (${selectedUnit})`;

            const img = document.getElementById('mode-plot-img');
            const loader = document.getElementById('mode-plot-loader');

            img.classList.add('hidden', 'opacity-0');
            modal.classList.add('active');

            const cacheKey = `${row.smiles}_${valKey}_${currentTheme}_${selectedUnit}`;

            // Check cache
            if (window.modePlotCache[cacheKey] && window.modePlotCache[cacheKey] !== 'loading' && window.modePlotCache[cacheKey] !== 'error') {
                loader.style.display = 'none';
                img.src = window.modePlotCache[cacheKey];
                img.onload = () => {
                    img.classList.remove('hidden', 'opacity-0');
                };
                return;
            }

            loader.style.display = 'block';

            try {
                const reqBody = {
                    mu: row[`${valKey}_mdn_mu`].map(x => convertEnergy(x, selectedUnit)),
                    sigma: row[`${valKey}_mdn_sigma`].map(x => convertEnergy(x, selectedUnit)),
                    pi: row[`${valKey}_mdn_pi`],
                    predicted_value: convertEnergy(row[valKey], selectedUnit),
                    uncertainty: convertEnergy(row[`${valKey}_uncertainty`], selectedUnit),
                    target_name: name,
                    unit: selectedUnit,
                    theme: currentTheme
                };
                const r = await fetch('/api/plot/mode', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(reqBody)
                });
                if(r.ok) {
                    const blob = await r.blob();
                    const url = URL.createObjectURL(blob);
                    window.modePlotCache[cacheKey] = url;
                    img.src = url;
                    img.onload = () => {
                        loader.style.display = 'none';
                        img.classList.remove('hidden', 'opacity-0');
                    };
                } else {
                    loader.style.display = 'none';
                    img.alt = 'Failed to load plot';
                }
            } catch(e) {
                console.error("Plotly Mode error", e);
                loader.style.display = 'none';
            }
        }

        function openDetailedAnalysis(idx) {
            const row = window.appData[idx];
            if(!row) return;
            const detailPanel = document.getElementById('detailed-analysis-panel');
            detailPanel.className = 'mt-8 border-t border-[var(--border-color)] pt-8';
            injectAnalysis(detailPanel, row);
            detailPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        async function injectAnalysis(containerEl, row) {
            containerEl.innerHTML = `
                <div class="flex justify-center my-8">
                    <div class="spinner border-t-[#6366f1]"></div>
                </div>
            `;

            const analysisGrid = `
                <div>
                   <div class="flex justify-between items-center mb-4 border-b border-[var(--border-color)] pb-2 flex-wrap gap-4">
                       <h4 class="text-lg font-bold text-[var(--text-heading)] flex items-center gap-2">
                           <svg class="w-5 h-5 text-[#0ea5e9]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                           Spin Density Distribution
                           <span class="font-mono text-sm ml-2 px-2 py-1 bg-[var(--btn-ghost-bg)] border border-[var(--border-color)] rounded">${row.smiles}</span>
                       </h4>
                       <div class="flex items-center gap-3">
                           <span class="text-sm font-medium text-[var(--text-muted)]">Show Uncertainty</span>
                           <label class="toggle-switch">
                               <input type="checkbox" id="toggle-unc-${row.smiles.replace(/\W/g,'_')}">
                               <span class="slider"></span>
                           </label>
                       </div>
                   </div>
                   <div class="bg-[var(--bg-surface)] rounded-xl overflow-hidden shadow-[0_0_20px_rgba(0,0,0,0.1)] [data-theme='dark']:shadow-[0_0_20px_rgba(0,0,0,0.5)] border border-[var(--border-color)]">
                       <div id="spin-plotly" class="w-full h-[500px] flex items-center justify-center">
                           <div class="spinner border-t-[var(--ring-color)]"></div>
                       </div>
                   </div>
                </div>
            `;
            containerEl.innerHTML = analysisGrid;

            // Load interactive spin density
            const currentTheme = document.body.getAttribute('data-theme') || 'light';
            const loadSpinPlot = async (showUnc) => {
                const spDiv = document.getElementById('spin-plotly');
                spDiv.innerHTML = '<div class="spinner border-t-[var(--ring-color)]"></div>';
                try {
                    const r = await fetch('/api/plot/spin', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            smiles: row.smiles,
                            spin_population: row.spin_map,
                            uncertainty: row.spin_map_uncertainty,
                            show_uncertainty: showUnc,
                            theme: currentTheme
                        })
                    });
                    if(r.ok) {
                        const figObj = await r.json();
                        spDiv.innerHTML = '';
                        Plotly.newPlot(spDiv, figObj.data, figObj.layout, {responsive: true, displayModeBar: false});
                    }
                } catch(e) { console.error("Plotly Spin error", e); spDiv.innerHTML="<p class='text-black'>Failed to load plot</p>"; }
            };

            await loadSpinPlot(false);

            // Checkbox listener
            const cbx = document.getElementById(`toggle-unc-${row.smiles.replace(/\W/g,'_')}`);
            if(cbx) {
                cbx.addEventListener('change', (e) => {
                    loadSpinPlot(e.target.checked);
                });
            }
        }


        function runRenderResults() {
            renderResults(window.appData, window.currentInvalid || []);
        }

        async function getSmilesFromKetcher() {
            try {
                const ketcherFrame = document.getElementById('ketcher-iframe');
                const ketcher = ketcherFrame.contentWindow.ketcher;
                if (!ketcher) {
                    alert("Ketcher is not fully loaded yet.");
                    return;
                }
                const smiles = await ketcher.getSmiles();
                const inputArea = document.getElementById('smiles-input');

                if (smiles) {
                    // Append if there's already content, otherwise replace
                    if (inputArea.value.trim().length > 0) {
                        inputArea.value = inputArea.value.trim() + '\n' + smiles;
                    } else {
                        inputArea.value = smiles;
                    }
                }
            } catch (err) {
                console.error("Error getting SMILES from Ketcher", err);
                alert("Failed to get SMILES from Ketcher.");
            }
        }

        async function runAnalysis() {
            const rawSmiles = document.getElementById('smiles-input').value;
            const smilesArray = rawSmiles.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            const errBox = document.getElementById('error-box');
            errBox.classList.add('hidden');
            errBox.innerText = '';

            if (smilesArray.length === 0) {
                errBox.innerText = "Please provide at least one SMILES.";
                errBox.classList.remove('hidden');
                return;
            }

            const loader = document.getElementById('loader');
            loader.classList.add('active');

            try {
                const res = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ smiles: smilesArray })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || data.error || 'Server error');
                }

                window.appData = data.results;
                window.currentInvalid = data.invalid;
                window.modePlotCache = {}; // clear cached images on new run

                const container = document.getElementById('main-container');
                container.classList.remove('focus-input', 'has-marcus');
                container.classList.add('has-results');

                document.getElementById('btn-marcus').classList.remove('hidden');

                runRenderResults();
                prefetchInitialPlots(); // Prefetch images in background for instant loading

            } catch (e) {
                errBox.innerText = e.message;
                errBox.classList.remove('hidden');
            } finally {
                loader.classList.remove('active');
            }
        }

        function renderResults(results, invalid) {
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            const selectedUnit = document.getElementById('unit-select').value;

            if (invalid && invalid.length > 0) {
                const warn = document.createElement('div');
                warn.className = 'bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 p-3 rounded-lg mb-6 text-sm font-medium';
                warn.innerText = 'Ignored invalid SMILES: ' + invalid.join(', ');
                container.appendChild(warn);
            }

            if (!results || results.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-12 text-[var(--text-muted)]">
                        <svg class="w-12 h-12 mb-4 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <p class="text-sm font-medium">No valid results.</p>
                    </div>`;
                return;
            }

            const table = document.createElement('table');
            table.className = 'sleek-table w-full text-left';

            // Header
            const thead = document.createElement('thead');
            thead.innerHTML = `
                <tr>
                    <th>SMILES</th>
                    <th>E_T <span class="text-xs opacity-50">(${selectedUnit})</span></th>
                    <th>λ_S_T <span class="text-xs opacity-50">(${selectedUnit})</span></th>
                    <th>λ_T_S <span class="text-xs opacity-50">(${selectedUnit})</span></th>
                    ${results.length > 1 ? '<th class="text-right">Actions</th>' : ''}
                </tr>
            `;
            table.appendChild(thead);

            // Body
            const tbody = document.createElement('tbody');

            const cellVal = (idx, row, key, name) => {
                const convertedVal = convertEnergy(row[key], selectedUnit);
                const convertedUnc = convertEnergy(row[`${key}_uncertainty`], selectedUnit);
                return `
                <div class="flex items-center gap-2 whitespace-nowrap">
                    <span class="font-medium flex-1">${convertedVal.toFixed(2)} <span class="text-xs text-[var(--text-muted)] ml-0.5" title="Uncertainty">±${convertedUnc.toFixed(2)}</span></span>
                    <button onclick="showModePlot(${idx}, '${key}', '${name}')" class="text-[var(--text-muted)] hover:text-[#0ea5e9] transition-colors bg-[var(--btn-ghost-bg)] p-1 rounded hover:bg-[var(--btn-ghost-hover)]" title="View mode distribution">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18M9 15l3-3 4 4 5-5" /></svg>
                    </button>
                </div>
            `};

            results.forEach((row, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="word-break: break-all; font-family: ui-monospace, monospace; font-size: 0.85rem;" class="text-[var(--text-main)] w-1/3">${row.smiles}</td>
                    <td>${cellVal(idx, row, 'triplet_energy_adiabatic', 'Triplet energy (adiabatic)')}</td>
                    <td>${cellVal(idx, row, 'lamda_S_T', '(S†→T)')}</td>
                    <td>${cellVal(idx, row, 'lamda_T_S', '(T†→S)')}</td>
                    ${results.length > 1 ? `
                    <td class="text-right">
                        <button onclick="openDetailedAnalysis(${idx})" class="text-xs bg-[var(--bg-body)] border border-[var(--border-color)] hover:border-[#6366f1] text-[var(--text-muted)] hover:text-[var(--text-main)] transition-all px-3 py-1.5 rounded inline-flex items-center gap-2">
                           <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                           Detailed Analysis
                        </button>
                    </td>` : ''}
                `;
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            container.appendChild(table);

            const detailPanel = document.createElement('div');
            detailPanel.id = 'detailed-analysis-panel';
            container.appendChild(detailPanel);

            // If only one result, automatically display analysis directly below
            if(results.length === 1) {
                detailPanel.className = 'mt-8 border-t border-[var(--border-color)] pt-8';
                injectAnalysis(detailPanel, results[0]);
            }

            // Populate Quencher dropdown for Marcus Theory
            const qSelect = document.getElementById('quencher-select');
            qSelect.innerHTML = '';
            results.forEach((r, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = r.smiles;
                qSelect.appendChild(opt);
            });
        }

        // --- Marcus Theory Functions ---

        async function fetchPhotocatalysts() {
            try {
                const r = await fetch('/api/photocatalysts');
                if(r.ok) {
                    const data = await r.json();
                    window.pcData = data.photocatalysts;
                    const pcSelect = document.getElementById('pc-select');
                    pcSelect.innerHTML = '';
                    window.pcData.forEach((pc, i) => {
                        const opt = document.createElement('option');
                        opt.value = i;
                        opt.innerText = pc.name;
                        pcSelect.appendChild(opt);
                    });
                }
            } catch(e) {
                console.error("Failed to fetch photocatalysts", e);
            }
        }

        function toggleMarcusTheory(e) {
            e.stopPropagation();
            if(window.pcData.length === 0) {
                fetchPhotocatalysts().then(() => runMarcusAnalysis());
            } else {
                runMarcusAnalysis();
            }
            handleSectionClick('marcus');
        }

        function closeMarcusTheory(e) {
            e.stopPropagation();
            handleSectionClick('results');
        }

        async function runMarcusAnalysis() {
            const pcIdx = document.getElementById('pc-select').value;
            const qIdx = document.getElementById('quencher-select').value;
            if(!pcIdx || !qIdx || !window.appData[qIdx] || !window.pcData[pcIdx]) return;

            const unit = document.getElementById('unit-select').value;
            const qVal = window.appData[qIdx];
            const pcVal = window.pcData[pcIdx];

            const reqBody = {
                pc_adiabatic_E_T: convertEnergy(pcVal.E_T_adiabatic, unit),
                pc_lambda_S_T: convertEnergy(pcVal.lamda_S_T, unit),
                pc_lambda_T_S: convertEnergy(pcVal.lamda_T_S, unit),
                quencher_E_T: convertEnergy(qVal.triplet_energy_adiabatic, unit),
                quencher_lambda_S_T: convertEnergy(qVal.lamda_S_T, unit),
                quencher_lambda_T_S: convertEnergy(qVal.lamda_T_S, unit),
                unit: unit
            };

            // Setup loading state
            const rContainer = document.getElementById('marcus-results-container');
            const pContainer = document.getElementById('marcus-plot-container');
            rContainer.innerHTML = '<div class="flex justify-center py-4"><div class="spinner border-t-emerald-500"></div></div>';
            pContainer.innerHTML = '<div class="spinner border-t-emerald-500"></div>';

            try {
                // Fetch metrics
                const r1 = await fetch('/api/marcus/compute', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(reqBody)
                });
                if(r1.ok) {
                    const metrics = await r1.json();
                    rContainer.innerHTML = `
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                            <div class="bg-[var(--input-bg)] border border-[var(--border-color)] rounded-xl p-4 text-center">
                                <div class="text-[var(--text-muted)] text-sm mb-1">ΔG</div>
                                <div class="text-xl font-bold text-[var(--text-heading)]">${metrics.dG.toFixed(2)}</div>
                                <div class="text-xs text-[var(--text-muted)] opacity-50">${unit}</div>
                            </div>
                            <div class="bg-[var(--input-bg)] border border-[var(--border-color)] rounded-xl p-4 text-center">
                                <div class="text-[var(--text-muted)] text-sm mb-1">ΔG<sup>‡</sup> (forward)</div>
                                <div class="text-xl font-bold text-[var(--text-heading)]">${metrics.dG_activation.toFixed(2)}</div>
                                <div class="text-xs text-[var(--text-muted)] opacity-50">${unit}</div>
                            </div>
                            <div class="bg-[var(--input-bg)] border border-[var(--border-color)] rounded-xl p-4 text-center">
                                <div class="text-[var(--text-muted)] text-sm mb-1">ΔG<sup>‡</sup> (backward)</div>
                                <div class="text-xl font-bold text-[var(--text-heading)]">${metrics.dG_activation_backEnT.toFixed(2)}</div>
                                <div class="text-xs text-[var(--text-muted)] opacity-50">${unit}</div>
                            </div>
                        </div>
                    `;
                }

                // Fetch plot
                const r2 = await fetch('/api/marcus/plot', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(reqBody)
                });
                if (r2.ok) {
                    const blob = await r2.blob();
                    const url = URL.createObjectURL(blob);

                    let symmWarning = '';
                    if (r2.headers.get('X-Symmetric-Approx') === 'true') {
                        symmWarning = `<div class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-600 p-3 rounded-lg mb-4 text-sm font-medium">⚠️ Symmetric approximation used (reason: ${r2.headers.get('X-Symmetric-Reason')}).</div>`;
                    }

                    pContainer.innerHTML = symmWarning + `<img src="${url}" class="w-full h-auto rounded" style="max-height: 500px; object-fit: contain;" />`;
                }
            } catch(e) {
                console.error("Marcus analysis error", e);
                rContainer.innerHTML = `<div class="text-red-400 p-4">Error computing metrics</div>`;
                pContainer.innerHTML = `<div class="text-red-400 p-4">Error loading plot</div>`;
            }
        }

        // Re-run Marcus analysis on unit change
        document.getElementById('unit-select').addEventListener('change', () => {
            const container = document.getElementById('main-container');
            if (container.classList.contains('has-marcus')) {
                runMarcusAnalysis();
            }
        });

        // Setup initial theme mapping
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);

        function toggleTheme() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            const nextTheme = isDark ? 'light' : 'dark';
            document.body.setAttribute('data-theme', nextTheme);
            localStorage.setItem('theme', nextTheme);
            window.modePlotCache = {}; // clear cached images on theme switch!

            // Re-render open plots if they exist
            if (window.appData && window.appData.length > 0) {
                prefetchInitialPlots();
            }
        }

        // Close modal when clicking outside
        document.getElementById('mode-plot-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModeModal();
            }
        });
    </script>
</body>
</html>
